name: Refresh FINN primary data
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13 * * 1-5' # Best effort after Indian market close; GitHub schedules may run late.
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/api/requirements.txt
      - name: Refresh market prices and NSE filings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "Set DATABASE_URL to the deployed database before refreshing."; exit 1; }
          cd apps/api
          python -m app.cli ingest
